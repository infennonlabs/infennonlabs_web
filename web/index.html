  <script>
    // Keep Flutter's internal font-measurement text out of search-result snippets.
    // Google only honors data-nosnippet on span/div/section, so wrap the <p> Flutter adds.
    (function () {
      var TEXT = 'flutter typography measurement';
      function wrap(node) {
        if (node.nodeType !== 1 || node.tagName !== 'P' || node.textContent !== TEXT) return;
        var parent = node.parentNode;
        if (!parent || (parent.hasAttribute && parent.hasAttribute('data-nosnippet'))) return;
        var span = document.createElement('span');
        span.setAttribute('data-nosnippet', '');
        span.style.display = 'contents';
        parent.insertBefore(span, node);
        span.appendChild(node);
      }
      var observer = new MutationObserver(function (records) {
        records.forEach(function (record) { record.addedNodes.forEach(wrap); });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(function () { observer.disconnect(); }, 60000);
    })();
  </script>
  <script>
    // Load Google AdSense after Flutter's first frame so it does not compete with app startup
    // (it added ~1.1s to first paint on mobile). Same script and publisher ID as before; ad
    // units queued by adsbygoogle.push() run when it arrives. The google-adsense-account meta
    // tag above and ads.txt are unchanged.
    (function () {
      var loaded = false;
      function loadAds() {
        if (loaded) return;
        loaded = true;
        var script = document.createElement('script');
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8017542409324420';
        document.head.appendChild(script);
      }
      // Flutter dispatches this on window after the first frame renders.
      window.addEventListener('flutter-first-frame', function () { setTimeout(loadAds, 1500); }, { once: true });
      // Fallback if the event never fires (older engine, load error): 10s after window load.
      window.addEventListener('load', function () { setTimeout(loadAds, 10000); }, { once: true });
    })();
  </script>

  <title>Free Learning Games for Kids, No Subscription Required</title>
  <script id="seo-title-lock">
    // Flutter sets document.title at runtime (MaterialApp title) and Google indexes the rendered
    // title, so keep the SEO title above in place. Runs before the app starts.
    (function () {
      var t = document.title;
      try { Object.defineProperty(document, 'title', { configurable: true, get: function () { return t; }, set: function () {} }); } catch (e) {}
      var n = document.querySelector('title');
      if (n && window.MutationObserver) {
        new MutationObserver(function () { if (n.textContent !== t) n.textContent = t; })
          .observe(n, { childList: true, characterData: true, subtree: true });
      }
    })();
  </script>
