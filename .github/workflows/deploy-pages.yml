name: Deploy Homepage to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target to run
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stable

concurrency:
  group: infennon-labs-home-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'dev'
    env:
      DEPLOY_PATH: dev
      CENTRAL_REPO: infennonlabs/learning_workspace
      SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
    steps:
      - name: Checkout homepage repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch centralized workspace packages
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_REPOS_TOKEN:-}" ]]; then
            echo "ERROR: SOURCE_REPOS_TOKEN is required to fetch centralized packages."
            exit 1
          fi

          rm -rf ../.workspace-copilot
          git clone --depth 1 "https://x-access-token:${SOURCE_REPOS_TOKEN}@github.com/${CENTRAL_REPO}.git" ../.workspace-copilot

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preflight Flutter environment
        run: flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web for dev Pages path
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/dev/"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Publish dev Pages content
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: ${{ env.DEPLOY_PATH }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy homepage dev preview from ${{ github.sha }}"

  deploy_stable:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'stable' && github.ref == 'refs/heads/main')
    env:
      DEPLOY_PATH: stable
      CENTRAL_REPO: infennonlabs/learning_workspace
      SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
    steps:
      - name: Checkout homepage repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch centralized workspace packages
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_REPOS_TOKEN:-}" ]]; then
            echo "ERROR: SOURCE_REPOS_TOKEN is required to fetch centralized packages."
            exit 1
          fi

          rm -rf ../.workspace-copilot
          git clone --depth 1 "https://x-access-token:${SOURCE_REPOS_TOKEN}@github.com/${CENTRAL_REPO}.git" ../.workspace-copilot

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preflight Flutter environment
        run: flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web for stable Pages path
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/stable/"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Publish stable Pages content
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: ${{ env.DEPLOY_PATH }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy homepage stable from main @ ${{ github.sha }}"